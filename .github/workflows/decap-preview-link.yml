name: Decap Preview Link

# Liest den Vercel-Bot-Comment auf einem PR aus und postet einen
# zusätzlichen GitHub Commit Status mit context "deploy/preview" und
# target_url = echte Preview-URL.
#
# Decap CMS findet diesen Status (context enthält "deploy") und rendert
# beim Klick auf "Check for Preview" einen Direktlink zur Preview-Site.

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  post-preview-status:
    # Nur wenn:
    # - der Comment auf einem PR liegt (nicht auf einer normalen Issue)
    # - der Comment vom Vercel-Bot kommt
    # - die Payload (base64-encoded) enthalten ist
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'vercel[bot]' &&
      contains(github.event.comment.body, 'eyJ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse comment + post deploy/preview status
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;

            // Vercel-Bot-Comment beginnt mit "[vc]: #SIGNATURE:BASE64-PAYLOAD"
            // → den Base64-Block nach dem zweiten ":" extrahieren
            const match = body.match(/:([A-Za-z0-9+/]+=*)\n/);
            if (!match) {
              core.info('Kein Base64-Block im Comment gefunden.');
              return;
            }
            let payload;
            try {
              payload = JSON.parse(Buffer.from(match[1], 'base64').toString('utf-8'));
            } catch (e) {
              core.warning('Base64-Decode/JSON-Parse fehlgeschlagen: ' + e.message);
              return;
            }

            const project = (payload.projects || [])[0];
            if (!project?.previewUrl) {
              core.info('Keine previewUrl im Payload.');
              return;
            }

            const previewUrl = 'https://' + project.previewUrl;
            const vercelState = (project.nextCommitStatus || 'DEPLOYED').toUpperCase();
            const ghState =
              vercelState === 'DEPLOYED'           ? 'success' :
              vercelState === 'BUILDING'           ? 'pending' :
              vercelState === 'QUEUED'             ? 'pending' :
              vercelState === 'CANCELED'           ? 'error'   :
              vercelState === 'ERROR'              ? 'error'   :
                                                     'success';

            // SHA des PRs holen (= Source-Commit, auf den der Status gehört)
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.issue.number,
            });
            const sha = pr.data.head.sha;

            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha,
              state:       ghState,
              target_url:  previewUrl,
              context:     'deploy/preview',
              description: ghState === 'success'
                ? 'Direkter Link zur Vercel-Preview'
                : `Vercel: ${vercelState}`,
            });

            core.info(`✓ deploy/preview status posted: ${ghState} → ${previewUrl} for ${sha}`);
