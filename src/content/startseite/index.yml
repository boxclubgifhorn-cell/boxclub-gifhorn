claim:
  kicker: "Hier werden Sieger wie am Fließband gemacht"
  headline: "Der Nr. 1 Verein in Gifhorn!"
  text: >
    Regelmäßiges Boxen fördert Beweglichkeit, Schnellkraft, Kondition,
    Kraftausdauer und natürlich die Fettverbrennung.

benefits:
  kicker: "Warum wir"
  headline_part1: "Was uns"
  headline_part2_gold: "auszeichnet"
  subtitle: "Mehr als ein Verein — eine Familie, die dich stärker macht."
  items:
    - title: "Tradition & Expertise"
      description: "Über 50 Jahre Vereinsgeschichte und eine Historie voller Champions. Unser Trainerteam weiß, wie man Talente bis zur Weltspitze führt."
    - title: "Werte & Disziplin"
      description: "Wir trainieren nicht nur den Körper, sondern den Charakter. Respekt, Fairplay und Zusammenhalt stehen in jeder Einheit an erster Stelle."
    - title: "Bestes Equipment"
      description: "Vom klassischen Sandsack-Areal bis zum professionellen Wettkampfring — unser Equipment ist auf dem neuesten Stand für dein optimales Training."
    - title: "Inklusivität & Vielfalt"
      description: "Egal ob 5 oder 70 Jahre, ob Anfänger oder Profi: In unserer Gemeinschaft findet jeder seinen Platz und sein individuelles Ziel."
    - title: "Professionelles Trainerteam"
      description: "Lizenzierte Coaches mit Wettkampf-Erfahrung. Fundiertes Fachwissen und moderne Trainingsmethoden — für jedes Niveau."
    - title: "Gezielte Nachwuchsförderung"
      description: "Wir investieren in die Zukunft. Spezielle Programme für Kinder und Jugendliche fördern Motorik, Selbstbewusstsein und Teamgeist."

faq:
  kicker: "FAQ"
  headline_part1: "Häufig gestellte"
  headline_part2_orange: "Fragen"
  subtitle: "Du hast Fragen? Hier findest du Antworten auf die häufigsten Fragen rund um unser Training und den Verein."
  items:
    - frage: "Muss ich mich vorher anmelden?"
      antwort: "Nein. Schau in den Kursplan, welcher Kurs zu dir passt, komm einfach in Sportzeug vorbei und mach mit. Bei Fragen kannst du uns gerne vorher anrufen."
    - frage: "Für welche Altersgruppen ist das Training geeignet?"
      antwort: "Von Kindern ab 5 Jahren bis zu Erwachsenen jeden Alters. Wir haben eigene Programme für Kids, Jugendliche, Anfänger, Fortgeschrittene und Wettkämpfer."
    - frage: "Was kostet die Mitgliedschaft?"
      antwort: "Aktuelle Beiträge erfährst du vor Ort beim Training oder telefonisch. Als gemeinnütziger Verein halten wir die Beiträge bewusst niedrig."
    - frage: "Brauche ich eigene Ausrüstung?"
      antwort: "Für den Anfang reicht Sportzeug. Boxhandschuhe und Bandagen kannst du dir bei uns ausleihen, später empfehlen wir eigene Ausrüstung."
    - frage: "Bietet ihr auch Selbstverteidigung an?"
      antwort: "Ja — durch unsere Programme in Boxen, MMA, Judo und Ringen lernst du praxistaugliche Selbstverteidigung als natürlichen Teil des Trainings."

