# ============================================================================
# Decap CMS – Boxclub Gifhorn e.V. Admin-Bereich
# ============================================================================
#
# Local-Modus (lokales Editieren, keine Auth nötig):
#   1. npm install (einmalig)
#   2. npx decap-server   (separater Terminal)
#   3. npm run dev        (Astro dev server)
#   4. http://localhost:4321/admin/ aufrufen
#
# Production (GitHub-Login):
#   1. GitHub OAuth App registrieren:
#        Settings → Developer settings → OAuth Apps → New OAuth App
#        Homepage:        https://<deine-domain>
#        Callback URL:    https://<oauth-proxy>/callback
#   2. OAuth-Proxy hosten (z.B. mit decap-proxy auf Vercel/Cloudflare)
#        Repo-Tipp:  https://github.com/decaporg/decap-proxy
#   3. base_url unten anpassen (URL des OAuth-Proxy)
#
# ============================================================================

backend:
  name: github
  repo: boxclubgifhorn-cell/boxclub-gifhorn
  branch: main
  # OAuth-Proxy: eigene Vercel-Function im selben Projekt
  base_url: https://om-boxclub-gifhorn.vercel.app
  auth_endpoint: api/auth
  # GitHub Action .github/workflows/decap-preview-link.yml parst den
  # Vercel-Bot-Comment im PR und postet einen zweiten Commit-Status mit
  # context "deploy/preview" und target_url = ECHTE Preview-URL.
  # Decap rendert daraus den Direkt-Link in der "Check for Preview"-Box.
  preview_context: deploy/preview

# UI-Sprache der Decap-Oberfläche (Buttons, Statusmeldungen, Dialoge)
locale: de

# Lokale Entwicklung (Decap erkennt localhost automatisch)
local_backend: true

# Editorial Workflow: Änderungen → Draft → Review → Publish
publish_mode: editorial_workflow

# Media-Uploads landen hier (öffentlich erreichbar)
media_folder: "public/uploads"
public_folder: "/uploads"

# Site-Display-Name in der Admin-UI — wird für "Visit Site" + Preview-Links genutzt.
# Solange boxclub-gifhorn.de noch auf den alten All-Inkl-Webspace zeigt (DNS nicht
# umgestellt), MUSS hier die Vercel-URL stehen — sonst landen Vorschau-Klicks auf
# der veralteten Site. Nach DNS-Switch zurück auf https://boxclub-gifhorn.de
# umstellen.
site_url: https://om-boxclub-gifhorn.vercel.app
display_url: https://om-boxclub-gifhorn.vercel.app
show_preview_links: true
logo_url: /logo.png

collections:
  # --------------------------------------------------------------------------
  # Vereinsdaten (Single-Entry) — gilt für die ganze Site
  # --------------------------------------------------------------------------
  - name: "global"
    label: "Vereinsdaten"
    description: "Telefon, E-Mail, Adresse — werden überall auf der Site (Header, Footer, Kontakt) verwendet."
    editor:
      preview: false
    files:
      - file: "src/content/global/site.yml"
        label: "Vereinsdaten"
        name: "site"
        fields:
          - { name: "firma_name", label: "Vereinsname", widget: "string" }
          - { name: "telefon", label: "Telefon (Anzeige)", widget: "string", hint: "Wie angezeigt, z.B. '05371 7599679'" }
          - { name: "telefon_link", label: "Telefon (für Click-to-Call)", widget: "string", hint: "Internationales Format ohne Leerzeichen, z.B. '+4953717599679'" }
          - { name: "email", label: "E-Mail", widget: "string" }
          - { name: "adresse", label: "Adresse", widget: "string" }
          - { name: "adresse_hinweis", label: "Anfahrts-Hinweis", widget: "text", required: false }
          - { name: "brand_subtitel", label: "Brand-Untertitel (Header/Footer)", widget: "string", required: false, hint: "z.B. 'Gifhorn e.V.'" }
          - { name: "footer_brand_text", label: "Footer-Beschreibung", widget: "text", required: false }
          - { name: "instagram", label: "Instagram-URL", widget: "string", required: false, hint: "z.B. https://www.instagram.com/bcg_e.v/ — wird in Footer und Kontakt-Seite verlinkt. Leer lassen = ausgeblendet." }

  # --------------------------------------------------------------------------
  # Startseite — Hero, Benefits, FAQ, CTA, Contact-Header
  # --------------------------------------------------------------------------
  - name: "startseite"
    label: "Startseite"
    description: "Alle Texte und Bilder der Startseite. Bearbeite die Sektionen einzeln."
    editor:
      preview: false
    files:
      - file: "src/content/startseite/index.yml"
        label: "Startseite (alle Sektionen)"
        name: "index"
        media_folder: "/public/uploads/startseite"
        public_folder: "/uploads/startseite"
        fields:
          # ---- Hero ----
          - name: "hero"
            label: "Hero (oberster Bereich)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "badge", label: "Badge (kleine Überschrift)", widget: "string" }
              - { name: "headline_zeile1", label: "Headline Zeile 1 (weiß)", widget: "string" }
              - { name: "headline_zeile2_rot", label: "Headline Zeile 2 (orange)", widget: "string" }
              - { name: "headline_zeile3", label: "Headline Zeile 3 (weiß)", widget: "string" }
              - { name: "headline_zeile4_gold", label: "Headline Zeile 4 (gold)", widget: "string" }
              - { name: "subheadline", label: "Unter-Text", widget: "text" }
              - { name: "cta_primary_label", label: "Haupt-Button-Text", widget: "string" }
              - { name: "cta_secondary_label", label: "Sekundär-Button-Text", widget: "string" }
              - { name: "bild", label: "Hintergrund-Bild (groß)", widget: "image", required: false, hint: "Hauptbild im Hintergrund. Leer = Default-Stock-Foto." }
              - { name: "bild_seitlich", label: "Bild rechts (Desktop)", widget: "image", required: false, hint: "Das schräge Bild rechts im Hero. Nur ab Tablet sichtbar." }
              - name: "stats"
                label: "Stats-Kacheln (unten im Hero)"
                widget: "list"
                summary: "{{wert}} {{label_oben}} {{label_unten}}"
                fields:
                  - { name: "wert", label: "Wert", widget: "string", hint: "z.B. '50+'" }
                  - { name: "label_oben", label: "Label oben", widget: "string", hint: "z.B. 'Jahre'" }
                  - { name: "label_unten", label: "Label unten", widget: "string", hint: "z.B. 'Erfahrung'" }
                  - { name: "farbe", label: "Farbe", widget: "select", options: ["orange", "gold"], default: "orange" }

          # ---- Claim-Banner (zwischen Hero und Leistungen) ----
          - name: "claim"
            label: "Claim-Banner"
            widget: "object"
            collapsed: true
            required: false
            hint: "Plakativer Banner direkt nach dem Hero. Leer lassen blendet den Banner aus."
            fields:
              - { name: "kicker", label: "Mini-Überschrift (klein, oben)", widget: "string", required: false, hint: "z.B. 'Hier werden Sieger wie am Fließband gemacht'" }
              - { name: "headline", label: "Hauptaussage (groß, orange)", widget: "string", required: false, hint: "z.B. 'Der Nr. 1 Verein in Gifhorn!'" }
              - { name: "text", label: "Beschreibung", widget: "text", required: false }

          # ---- Benefits ----
          - name: "benefits"
            label: "Was uns auszeichnet (Benefits)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Mini-Überschrift", widget: "string" }
              - { name: "headline_part1", label: "Headline Teil 1", widget: "string" }
              - { name: "headline_part2_gold", label: "Headline Teil 2 (gold)", widget: "string" }
              - { name: "subtitle", label: "Untertitel", widget: "string" }
              - name: "items"
                label: "Vorteile"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { name: "title", label: "Titel", widget: "string" }
                  - { name: "description", label: "Beschreibung", widget: "text" }

          # ---- FAQ ----
          - name: "faq"
            label: "Häufige Fragen"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Mini-Überschrift", widget: "string" }
              - { name: "headline_part1", label: "Headline Teil 1", widget: "string" }
              - { name: "headline_part2_orange", label: "Headline Teil 2 (orange)", widget: "string" }
              - { name: "subtitle", label: "Untertitel", widget: "text" }
              - name: "items"
                label: "Fragen & Antworten"
                widget: "list"
                summary: "{{frage}}"
                fields:
                  - { name: "frage", label: "Frage", widget: "string" }
                  - { name: "antwort", label: "Antwort", widget: "text" }

          # ---- CTA ----
          - name: "cta"
            label: "CTA-Banner (vor dem Footer)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Mini-Überschrift", widget: "string" }
              - { name: "headline_part1", label: "Headline Teil 1", widget: "string" }
              - { name: "headline_part2_orange", label: "Headline Teil 2 (orange)", widget: "string" }
              - { name: "headline_part3", label: "Headline Teil 3", widget: "string" }
              - { name: "headline_part4_gold", label: "Headline Teil 4 (gold)", widget: "string" }
              - { name: "subtext", label: "Untertitel", widget: "text" }
              - { name: "primary_label", label: "Button-Text", widget: "string" }
              - name: "trust_items"
                label: "Trust-Badges (Punkte unter den Buttons)"
                widget: "list"
                field: { name: "text", label: "Badge-Text", widget: "string" }

          # ---- Contact Section ----
          - name: "contact_section"
            label: "Kontakt-Sektion (Startseite)"
            widget: "object"
            collapsed: true
            fields:
              - { name: "kicker", label: "Mini-Überschrift", widget: "string" }
              - { name: "headline_part1", label: "Headline Teil 1", widget: "string" }
              - { name: "headline_part2_orange", label: "Headline Teil 2 (orange)", widget: "string" }
              - { name: "intro", label: "Einleitungstext", widget: "text" }
              - { name: "form_titel", label: "Formular-Überschrift", widget: "string" }
              - { name: "form_subtitel", label: "Formular-Untertitel", widget: "string" }

  # --------------------------------------------------------------------------
  # Leistungen / Kurse (mehrere Einträge)
  # --------------------------------------------------------------------------
  - name: "leistung"
    label: "Leistungen / Kurse"
    label_singular: "Leistung"
    description: "Trainingsangebote, die als Kacheln auf Startseite und Leistungen-Seite erscheinen."
    folder: "src/content/leistung"
    extension: "yml"
    format: "yml"
    create: true
    delete: true
    slug: "{{fields.title | lowercase}}"
    media_folder: "/public/uploads/leistung"
    public_folder: "/uploads/leistung"
    sortable_fields: ["reihenfolge", "title"]
    fields:
      - { name: "title", label: "Titel", widget: "string" }
      - { name: "tagline", label: "Tagline (kleines Badge oben links)", widget: "string" }
      - { name: "description", label: "Beschreibung", widget: "text" }
      - { name: "bild", label: "Foto", widget: "image", required: false }
      - { name: "bild_alt", label: "Foto-Beschreibung (Alt-Text)", widget: "string", required: false }
      - { name: "reihenfolge", label: "Reihenfolge (1 = zuerst)", widget: "number", value_type: "int", min: 1, default: 99 }

  # --------------------------------------------------------------------------
  # Mitgliedsantrag / Anmeldung (Single-Entry mit PDF-Upload)
  # --------------------------------------------------------------------------
  - name: "anmeldung"
    label: "Anmeldung / Mitgliedsantrag"
    label_singular: "Anmeldung"
    description: "Mitgliedsantrag als ausfüllbares PDF — wird auf /anmeldung angezeigt."
    editor:
      preview: false
    files:
      - file: "src/content/anmeldung/aktuell.yml"
        label: "Mitgliedsantrag (aktuell)"
        name: "aktuell"
        media_folder: "/public/uploads/anmeldung"
        public_folder: "/uploads/anmeldung"
        fields:
          - { name: "titel", label: "Seitentitel", widget: "string", default: "Mitglied werden" }
          - { name: "intro", label: "Einleitungstext", widget: "text", required: false }
          - { name: "online_url", label: "Online-Anmeldung URL", widget: "string", required: false, hint: "Externes Anmeldeformular (z.B. https://web.meinverein.de/profile/XXXXX). Wird beim nächsten Build automatisch in einen QR-Code umgewandelt." }
          - { name: "online_anbieter", label: "Anbieter-Name (zur Anzeige)", widget: "string", required: false, hint: "z.B. 'meinverein.de' — wird im Hinweis auf der Anmeldeseite angezeigt." }
          - { name: "formular_pdf", label: "Mitgliedsantrag (PDF, alternativ)", widget: "file", required: false, hint: "OPTIONAL: PDF als Alternative zum Online-Formular. Wenn beides angegeben ist, wird Online primär gezeigt." }
          - { name: "formular_stand", label: "Stand des PDF-Formulars", widget: "string", required: false, hint: "z.B. 'Januar 2026'" }
          - { name: "video_url", label: "Erklärvideo (MP4)", widget: "file", required: false, hint: "OPTIONAL: Kurzes Video, das das Ausfüllen der Beitrittserklärung erklärt. Wird unterhalb des PDF-Downloads angezeigt." }
          - { name: "video_titel", label: "Video-Titel", widget: "string", required: false, default: "Kurze Anleitung zum Ausfüllen" }
          - { name: "video_beschreibung", label: "Video-Beschreibung", widget: "text", required: false, hint: "Kurzer Hinweistext über dem Video." }
          - { name: "rueckgabe_email", label: "Rückgabe-E-Mail", widget: "string", required: false, hint: "Standard: info@boxclub-gifhorn.de" }
          - { name: "rueckgabe_adresse", label: "Rückgabe-Adresse", widget: "string", required: false, hint: "Standard: Cardenap 2-4, 38518 Gifhorn" }
          - { name: "hinweis", label: "Hinweis-Box (unten)", widget: "text", required: false, hint: "z.B. Hinweis auf Eltern-Unterschrift bei Minderjährigen." }
          - name: "schritte"
            label: "Schritte (3 Kacheln oben)"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { name: "titel", label: "Schritt-Titel", widget: "string" }
              - { name: "beschreibung", label: "Beschreibung", widget: "text" }

  # --------------------------------------------------------------------------
  # Rechtliche / statische Seiten (Markdown-Body)
  # --------------------------------------------------------------------------
  - name: "seite"
    label: "Rechtliche Seiten"
    label_singular: "Seite"
    description: "Impressum, Datenschutz, Barrierefreiheit und Satzung-Intro — bearbeitbar als Markdown."
    files:
      - file: "src/content/seite/impressum.md"
        label: "Impressum"
        name: "impressum"
        fields:
          - { name: "title", label: "Seitentitel", widget: "string", default: "Impressum" }
          - { name: "intro", label: "Einleitung (unter dem Titel)", widget: "string", required: false }
          - { name: "stand", label: "Stand-Datum", widget: "string", required: false, hint: "z.B. 'Mai 2026'" }
          - { name: "body", label: "Inhalt", widget: "markdown" }
      - file: "src/content/seite/datenschutz.md"
        label: "Datenschutzerklärung"
        name: "datenschutz"
        fields:
          - { name: "title", label: "Seitentitel", widget: "string", default: "Datenschutzerklärung" }
          - { name: "intro", label: "Einleitung", widget: "string", required: false }
          - { name: "stand", label: "Stand-Datum", widget: "string", required: false }
          - { name: "body", label: "Inhalt", widget: "markdown" }
      - file: "src/content/seite/barrierefreiheit.md"
        label: "Erklärung zur Barrierefreiheit"
        name: "barrierefreiheit"
        fields:
          - { name: "title", label: "Seitentitel", widget: "string", default: "Erklärung zur Barrierefreiheit" }
          - { name: "intro", label: "Einleitung", widget: "string", required: false }
          - { name: "stand", label: "Stand-Datum", widget: "string", required: false }
          - { name: "body", label: "Inhalt", widget: "markdown" }
      - file: "src/content/seite/satzung.md"
        label: "Satzung & Downloads – Intro"
        name: "satzung"
        fields:
          - { name: "title", label: "Seitentitel", widget: "string", default: "Satzung & Downloads" }
          - { name: "intro", label: "Einleitung", widget: "string", required: false }
          - { name: "body", label: "Einleitungstext (oberhalb der Download-Liste)", widget: "markdown" }

  # --------------------------------------------------------------------------
  # Downloads (PDFs für Satzung & Downloads-Seite)
  # --------------------------------------------------------------------------
  - name: "download"
    label: "Downloads"
    label_singular: "Download"
    description: "PDF-Dateien (Satzung, Beitragsordnung, Aufnahmeantrag etc.) für die Satzung-Seite."
    folder: "src/content/download"
    extension: "yml"
    format: "yml"
    create: true
    delete: true
    slug: "{{fields.titel | lowercase}}"
    media_folder: "/public/uploads/downloads"
    public_folder: "/uploads/downloads"
    sortable_fields: ["reihenfolge", "titel"]
    fields:
      - { name: "titel", label: "Titel", widget: "string", hint: "z.B. 'Vereinssatzung 2025'" }
      - { name: "beschreibung", label: "Beschreibung", widget: "text", required: false, hint: "1 Satz, der unter dem Titel erscheint." }
      - { name: "datei", label: "PDF-Datei", widget: "file", hint: "Hochladen — Decap legt sie unter /uploads/downloads/ ab." }
      - { name: "kategorie", label: "Kategorie (optional)", widget: "string", required: false, hint: "z.B. 'Satzung', 'Anträge', 'Ordnungen' — wenn gesetzt, gruppiert die Anzeige." }
      - { name: "stand", label: "Stand / Gültigkeit", widget: "string", required: false, hint: "z.B. 'Januar 2025'" }
      - { name: "reihenfolge", label: "Reihenfolge (1 = oben)", widget: "number", value_type: "int", min: 1, default: 99 }

  # --------------------------------------------------------------------------
  # News / Blog
  # --------------------------------------------------------------------------
  - name: "news"
    label: "News / Beiträge"
    label_singular: "News-Beitrag"
    description: "Aktuelle Meldungen, Wettkampfergebnisse und Vereinsmeldungen."
    folder: "src/content/news"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    preview_path: "news/{{slug}}"
    slug: "{{year}}-{{month}}-{{day}}-{{fields.titel | lowercase}}"
    media_folder: "/public/uploads/news"
    public_folder: "/uploads/news"
    sortable_fields: ["datum", "titel"]
    view_filters:
      - { label: "Nur veröffentlichte", field: "veroeffentlicht", pattern: "true" }
    fields:
      - { name: "titel", label: "Titel", widget: "string" }
      - { name: "datum", label: "Datum", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, format: "YYYY-MM-DD" }
      - { name: "gueltig_bis", label: "Sichtbar bis (optional)", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, format: "YYYY-MM-DD", required: false, default: "", hint: "Wenn gesetzt: Beitrag verschwindet ab diesem Tag automatisch von der Startseite. Leer lassen → bleibt sichtbar." }
      - { name: "kategorie", label: "Kategorie", widget: "string", required: false, hint: "z.B. 'Wettkampf', 'Verein', 'Termine'" }
      - { name: "autor", label: "Autor", widget: "string", required: false }
      - { name: "teaser", label: "Teaser (kurzer Vorschautext)", widget: "text", required: false, hint: "1-2 Sätze für die News-Übersicht." }
      - { name: "bild", label: "Titelbild", widget: "image", required: false }
      - { name: "bild_alt", label: "Bildbeschreibung (Alt-Text)", widget: "string", required: false }
      - { name: "veroeffentlicht", label: "Veröffentlicht", widget: "boolean", default: true, hint: "Wenn aus → Beitrag ist nur als Entwurf gespeichert." }
      - { name: "body", label: "Inhalt", widget: "markdown" }

  # --------------------------------------------------------------------------
  # Galerie (Bilder)
  # --------------------------------------------------------------------------
  - name: "galerie"
    label: "Galerie-Bilder"
    label_singular: "Bild"
    description: "Bilder für die Galerie-Seite. Mit Kategorie filterbar."
    folder: "src/content/galerie"
    extension: "yml"
    format: "yml"
    create: true
    delete: true
    slug: "{{fields.titel | lowercase}}"
    media_folder: "/public/uploads/galerie"
    public_folder: "/uploads/galerie"
    sortable_fields: ["reihenfolge", "datum", "titel"]
    fields:
      - { name: "titel", label: "Titel / Bildunterschrift", widget: "string" }
      - { name: "bild", label: "Bild", widget: "image" }
      - { name: "bild_alt", label: "Bildbeschreibung (Alt-Text)", widget: "string", required: false, hint: "Für Screenreader." }
      - { name: "kategorie", label: "Kategorie", widget: "string", required: false, hint: "z.B. 'Training', 'Wettkampf', 'Events'. Mit Kategorie → erscheint als Filter-Button." }
      - { name: "datum", label: "Aufnahme-Datum", widget: "string", required: false }
      - { name: "reihenfolge", label: "Reihenfolge (1 = oben)", widget: "number", value_type: "int", min: 1, default: 99 }

  # --------------------------------------------------------------------------
  # Sponsoren
  # --------------------------------------------------------------------------
  - name: "sponsor"
    label: "Sponsoren"
    label_singular: "Sponsor"
    description: "Sponsoren und Förderer, die in der Sponsoren-Seite angezeigt werden."
    folder: "src/content/sponsor"
    extension: "yml"
    format: "yml"
    create: true
    delete: true
    slug: "{{fields.name | lowercase}}"
    media_folder: "/public/uploads/sponsor"
    public_folder: "/uploads/sponsor"
    sortable_fields: ["reihenfolge", "name"]
    fields:
      - { name: "name", label: "Name", widget: "string" }
      - { name: "logo", label: "Logo", widget: "image", required: false, hint: "PNG/SVG mit transparentem Hintergrund empfohlen." }
      - { name: "link", label: "Webseite des Sponsors", widget: "string", required: false, hint: "Komplette URL mit https://" }
      - { name: "beschreibung", label: "Kurzbeschreibung", widget: "string", required: false }
      - { name: "kategorie", label: "Kategorie", widget: "string", required: false, hint: "z.B. 'Hauptsponsor', 'Premium', 'Förderer'. Bei mehreren Kategorien → Gruppierung auf der Seite." }
      - { name: "reihenfolge", label: "Reihenfolge", widget: "number", value_type: "int", min: 1, default: 99 }

  # --------------------------------------------------------------------------
  # Trainer-Profile (mehrere Einträge)
  # --------------------------------------------------------------------------
  - name: "trainer"
    label: "Trainer"
    label_singular: "Trainer"
    description: "Trainer:innen-Profile, die in der Trainer-Sektion auf der Startseite erscheinen."
    folder: "src/content/trainer"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{fields.name | lowercase}}"
    media_folder: "/public/uploads/trainer"
    public_folder: "/uploads/trainer"
    sortable_fields: ["reihenfolge", "name"]
    view_filters:
      - label: "Mit Foto"
        field: "foto"
        pattern: ".+"
    fields:
      - { name: "name", label: "Name", widget: "string", required: true, hint: "Voller Name oder 'Name folgt'" }
      - { name: "disziplin", label: "Disziplin / Rolle", widget: "string", required: true, hint: "z.B. 'Cheftrainer Boxen', 'Trainerin Frauenfitness'" }
      - { name: "reihenfolge", label: "Reihenfolge (1 = oben)", widget: "number", value_type: "int", min: 1, default: 99 }
      - { name: "foto", label: "Foto", widget: "image", required: false, hint: "Hochformat empfohlen (z.B. 800×1000px). Bei keinem Foto wird ein Platzhalter angezeigt." }
      - { name: "kurzbio", label: "Kurzbio", widget: "text", required: false, hint: "1–2 Sätze für die Kachel." }
      - { name: "body", label: "Beschreibung (Detail)", widget: "markdown", required: false, hint: "Längere Beschreibung — derzeit nur intern, nicht auf der Site angezeigt." }

  # --------------------------------------------------------------------------
  # Kursplan / Trainingsplan (ein einzelner Eintrag)
  # --------------------------------------------------------------------------
  - name: "kursplan"
    label: "Kursplan"
    label_singular: "Kursplan"
    description: "Aktueller Trainingsplan, der auf der Kursplan-Seite angezeigt wird."
    editor:
      preview: false
    files:
      - file: "src/content/kursplan/aktuell.yml"
        label: "Aktueller Trainingsplan"
        name: "aktuell"
        media_folder: "/public/uploads/kursplan"
        public_folder: "/uploads/kursplan"
        fields:
          - { name: "titel", label: "Seitentitel", widget: "string", default: "Trainingsplan", hint: "Überschrift der Kursplan-Seite." }
          - { name: "beschreibung", label: "Einleitung", widget: "text", required: false, hint: "Kurzer Text unter der Überschrift (1–2 Sätze)." }
          - { name: "bild", label: "Trainingsplan als Bild", widget: "image", required: false, hint: "Empfohlen: JPG oder PNG, mind. 1600px breit. Wird groß auf der Seite angezeigt." }
          - { name: "bild_alt", label: "Bildbeschreibung (Alt-Text)", widget: "string", required: false, hint: "Für Screenreader und SEO. z.B. 'Wochenplan Sommer 2026'." }
          - { name: "pdf", label: "Trainingsplan als PDF (optional)", widget: "file", required: false, hint: "Wenn vorhanden, erscheint ein Download-Button." }
          - { name: "stand", label: "Gültig ab", widget: "string", required: false, hint: "Z.B. 'September 2026' oder '01.10.2026'." }
          - { name: "hinweis", label: "Hinweis-Box (unter dem Plan)", widget: "text", required: false, hint: "Z.B. Hinweis auf Ferien-Abweichungen." }
          - name: "eintraege"
            label: "Kurs-Einträge (Wochenplan)"
            label_singular: "Eintrag"
            widget: "list"
            summary: "{{fields.tag}} {{fields.zeit}} – {{fields.kurs}}"
            hint: "Jede Zeile = ein Kurs. Sortierung in der Anzeige automatisch nach Tag + Zeit. Wenn leer → Bild oben wird gezeigt (Fallback)."
            fields:
              - { name: "tag", label: "Tag", widget: "select", options: ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"], required: true }
              - { name: "zeit", label: "Zeit", widget: "string", required: true, hint: "Z.B. '16:45–18:15' (Bindestrich oder Gedankenstrich)." }
              - { name: "kurs", label: "Kurs-Bezeichnung", widget: "string", required: true, hint: "Z.B. 'Boxen Kindertraining', 'Judo', 'MMA Anfänger / Fortgeschrittene'." }
              - { name: "zielgruppe", label: "Zielgruppe / Altersangabe", widget: "string", required: false, hint: "Z.B. 'ab 8–12 Jahre' oder leer lassen." }
              - { name: "farbe", label: "Farbcode", widget: "select", options: ["neutral", "orange", "blau", "gold", "rot"], default: "neutral", hint: "Bestimmt die Akzentfarbe in der Tabelle. orange=Boxen, blau=Judo/Frauen, gold=Highlight, rot=Kindertraining 5-8, neutral=alles andere." }
              - { name: "hinweis", label: "Mini-Badge (optional)", widget: "string", required: false, hint: "Z.B. 'Neu im Programm', wird als kleines goldenes Badge angezeigt." }
